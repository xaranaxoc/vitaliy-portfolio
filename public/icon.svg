<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="vg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Фон -->
  <rect width="512" height="512" fill="#0b0e14"/>
  <!-- Лёгкое свечение -->
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- Тонкая сетка (как на сайте) -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="51.2" y1="0" x2="51.2" y2="512"/><line x1="102.4" y1="0" x2="102.4" y2="512"/><line x1="153.60000000000002" y1="0" x2="153.60000000000002" y2="512"/><line x1="204.8" y1="0" x2="204.8" y2="512"/><line x1="256" y1="0" x2="256" y2="512"/><line x1="307.20000000000005" y1="0" x2="307.20000000000005" y2="512"/><line x1="358.40000000000003" y1="0" x2="358.40000000000003" y2="512"/><line x1="409.6" y1="0" x2="409.6" y2="512"/><line x1="460.8" y1="0" x2="460.8" y2="512"/>
    <line x1="0" y1="51.2" x2="512" y2="51.2"/><line x1="0" y1="102.4" x2="512" y2="102.4"/><line x1="0" y1="153.60000000000002" x2="512" y2="153.60000000000002"/><line x1="0" y1="204.8" x2="512" y2="204.8"/><line x1="0" y1="256" x2="512" y2="256"/><line x1="0" y1="307.20000000000005" x2="512" y2="307.20000000000005"/><line x1="0" y1="358.40000000000003" x2="512" y2="358.40000000000003"/><line x1="0" y1="409.6" x2="512" y2="409.6"/><line x1="0" y1="460.8" x2="512" y2="460.8"/>
  </g>
  <!-- Буква V (жирная, геометричная) со свечением -->
  <g filter="url(#softglow)">
    <path d="M150 150 L256 380 L362 150 L320 150 L256 290 L192 150 Z" fill="url(#vg)"/>
  </g>
  <!-- Точка-акцент (как "." в Vitaliy.dev) -->
  <circle cx="345" cy="160" r="14" fill="#71717a"/>
