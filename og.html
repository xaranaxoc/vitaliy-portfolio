<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>OG — Vitaliy</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Manrope", sans-serif;
    background: #0b0e14;
    color: #fafafa;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .grid-bg {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: radial-gradient(ellipse 60% 70% at 50% 50%, #000 30%, transparent 90%);
            mask-image: radial-gradient(ellipse 60% 70% at 50% 50%, #000 30%, transparent 90%);
  }
  .glow {
    position: absolute; border-radius: 50%; pointer-events: none;
    background: rgba(163,230,53,0.08); filter: blur(140px);
    width: 600px; height: 600px; left: 50%; top: 50%; transform: translate(-50%,-50%);
  }
  .content { position: relative; z-index: 1; text-align: center; padding: 0 60px; }
  .logo {
    font-family: "Unbounded", sans-serif;
    font-weight: 600; font-size: 30px; letter-spacing: -0.02em;
    position: absolute; top: 48px; left: 60px;
  }
  .logo .name { color: #bef264; }
  .logo .dev { color: #71717a; }
  .headline {
    font-family: "Unbounded", sans-serif;
    font-weight: 600; font-size: 72px; line-height: 1.05;
    letter-spacing: -0.035em; color: #fafafa;
  }
  .headline .accent {
    background: linear-gradient(100deg, #a3e635, #4ade80 50%, #22d3ee);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub {
    margin-top: 24px; font-size: 28px; line-height: 1.35; font-weight: 500;
    color: #a1a1aa; letter-spacing: -0.01em;
  }
  .divider {
    width: 80px; height: 2px; background: #bef264; margin: 32px auto;
    border-radius: 1px; opacity: 0.6;
  }
  .contacts {
    font-family: "JetBrains Mono", monospace; font-size: 18px; color: #71717a;
    display: flex; align-items: center; justify-content: center; gap: 20px;
  }
  .contacts .lime { color: #bef264; }
  .price {
    position: absolute; bottom: 48px; left: 60px;
    font-family: "JetBrains Mono", monospace; font-size: 16px; color: #52525b;
  }
  .price .val { color: #bef264; font-weight: 500; }
</style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="glow"></div>
  <div class="logo"><span class="name">Vitaliy</span><span class="dev">.dev</span></div>

  <div class="content">
    <h1 class="headline">Клиенты уходят<br><span class="accent">к конкурентам?</span></h1>
    <p class="sub">Сайт, который перехватывает их: заявки, оплаты и запись — 24/7, без вашего участия.</p>
    <div class="divider"></div>
    <div class="contacts">
      <span><span class="lime">▸</span> лендинг от 5 000 ₽</span>
      <span><span class="lime">▸</span> магазин от 15 000 ₽</span>
      <span><span class="lime">▸</span> ИИ-ассистент</span>
    </div>
  </div>

  <div class="price">matveev-devs.ru · <span class="val">под ключ · от 5 дней · по договору</span></div>
</body>
</html>
