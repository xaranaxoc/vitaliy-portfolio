<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>OG — Vitaliy</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Manrope", sans-serif;
    background: #0b0e14;
    color: #fafafa;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .grid-bg {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: radial-gradient(ellipse 60% 70% at 50% 50%, #000 30%, transparent 90%);
            mask-image: radial-gradient(ellipse 60% 70% at 50% 50%, #000 30%, transparent 90%);
  }
  .glow {
    position: absolute; border-radius: 50%; pointer-events: none;
    background: rgba(163,230,53,0.08); filter: blur(140px);
    width: 600px; height: 600px; left: 50%; top: 50%; transform: translate(-50%,-50%);
  }
  .content { position: relative; z-index: 1; text-align: center; }
  h1 {
    font-family: "Unbounded", sans-serif; font-weight: 600;
    font-size: 128px; line-height: 1.0; letter-spacing: -0.04em;
    color: #fafafa;
  }
  .role {
    margin-top: 24px; font-size: 36px; line-height: 1.3; font-weight: 500;
    color: #a1a1aa; letter-spacing: -0.01em;
  }
  .role .accent {
    background: linear-gradient(100deg, #a3e635, #4ade80 50%, #22d3ee);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    font-weight: 600;
  }
  .divider {
    width: 80px; height: 2px; background: #bef264; margin: 32px auto;
    border-radius: 1px; opacity: 0.6;
  }
  .contacts {
    font-family: "JetBrains Mono", monospace; font-size: 18px; color: #71717a;
    display: flex; align-items: center; justify-content: center; gap: 20px;
  }
  .contacts .lime { color: #bef264; }
</style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="glow"></div>
  <div class="content">
    <h1>Виталий</h1>
    <div class="role"><span class="accent">Fullstack-разработчик</span></div>
    <div class="divider"></div>
    <div class="contacts">
      <span><span class="lime">▸</span> сайты под ключ</span>
      <span><span class="lime">▸</span> Telegram</span>
      <span><span class="lime">▸</span> WhatsApp</span>
    </div>
  </div>
</body>
</html>
