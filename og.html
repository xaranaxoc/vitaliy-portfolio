<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>OG — Vitaliy</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Manrope", sans-serif;
    background: #f5f0e6;
    color: #3a2e20;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 80px;
  }
  .frame {
    position: absolute; inset: 40px;
    border: 1px solid rgba(74,55,27,0.14);
    border-radius: 24px;
  }
  .content { position: relative; z-index: 1; text-align: center; }
  .eyebrow {
    font-size: 18px; font-weight: 600; letter-spacing: 0.22em;
    text-transform: uppercase; color: #a27e3b;
  }
  h1 {
    font-family: "Unbounded", sans-serif; font-weight: 600;
    font-size: 124px; line-height: 1.0; letter-spacing: -0.04em;
    color: #3a2e20; margin-top: 28px;
  }
  h1 .dot { color: #a27e3b; }
  .role {
    margin-top: 26px; font-size: 34px; line-height: 1.3; font-weight: 500;
    color: #7a6650; letter-spacing: -0.01em;
  }
  .divider {
    width: 64px; height: 2px; background: #a27e3b; margin: 36px auto;
    border-radius: 1px; opacity: 0.7;
  }
  .contacts {
    font-size: 20px; color: #9a8870;
    display: flex; align-items: center; justify-content: center; gap: 22px;
  }
  .contacts .sep { color: #a27e3b; opacity: 0.6; }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="content">
    <div class="eyebrow">Fullstack-разработчик</div>
    <h1>Виталий<span class="dot">.</span></h1>
    <div class="role">Сайты и веб-приложения под ключ — из одних рук</div>
    <div class="divider"></div>
    <div class="contacts">
      <span>Telegram</span>
      <span class="sep">·</span>
      <span>WhatsApp</span>
      <span class="sep">·</span>
      <span>сайты под ключ</span>
    </div>
  </div>
</body>
</html>
