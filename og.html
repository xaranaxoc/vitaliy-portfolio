<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>OG — Vitaliy</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Inter", sans-serif;
    background: #0a0b10;
    color: #f3f4f8;
    -webkit-font-smoothing: antialiased;
    padding: 72px 80px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
  }
  .orb { position: absolute; border-radius: 50%; filter: blur(120px); pointer-events: none; }
  .orb1 { width: 520px; height: 520px; background: rgba(139,92,246,0.4); top: -160px; left: -120px; }
  .orb2 { width: 460px; height: 460px; background: rgba(113,112,255,0.4); bottom: -180px; right: -120px; }
  .orb3 { width: 320px; height: 320px; background: rgba(34,211,238,0.22); top: 40%; left: 38%; }
  .grid { position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 40%, #000 30%, transparent 90%);
            mask-image: radial-gradient(ellipse 70% 70% at 50% 40%, #000 30%, transparent 90%);
  }
  .row { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .vmark { width: 64px; height: 64px; border-radius: 16px; border: 1px solid rgba(113,112,255,0.4); background: rgba(113,112,255,0.14); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 34px; color: #7170ff; letter-spacing: -0.02em; }
  .brandname { font-weight: 600; font-size: 36px; letter-spacing: -0.025em; }
  .brandname .dot { color: #7170ff; }
  .tag { font-size: 15px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: #7170ff; }
  .center { position: relative; z-index: 1; }
  h1 { font-weight: 600; font-size: 100px; line-height: 1.02; letter-spacing: -0.03em; max-width: 940px; }
  h1 .accent { color: #7170ff; }
  .sub { margin-top: 26px; font-size: 26px; line-height: 1.4; font-weight: 500; color: #9a9dac; max-width: 800px; }
  .contacts { position: relative; z-index: 1; font-size: 19px; color: #6e7185; display: flex; gap: 24px; align-items: center; }
  .contacts .sep { color: #7170ff; opacity: 0.6; }
</style>
</head>
<body>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
  <div class="grid"></div>
  <div class="row">
    <div class="brand">
      <div class="vmark">V</div>
      <div class="brandname">Vitaliy<span class="dot">.</span></div>
    </div>
    <div class="tag">Сайты · магазины</div>
  </div>
  <div class="center">
    <h1>Сайты, которые <span class="accent">приносят клиентов</span></h1>
    <div class="sub">Под ключ, один человек, до поддержки. Отвечает сам разработчик.</div>
  </div>
  <div class="contacts">
    <span>Telegram</span>
    <span class="sep">·</span>
    <span>WhatsApp</span>
    <span class="sep">·</span>
    <span>по договору</span>
  </div>
</body>
</html>
