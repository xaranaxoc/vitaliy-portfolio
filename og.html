<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>OG — Vitaliy</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Manrope", sans-serif;
    background: #f5f0e6;
    color: #3a2e20;
    -webkit-font-smoothing: antialiased;
    padding: 72px 80px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .ghost {
    position: absolute; right: -120px; bottom: -260px; line-height: 1;
    font-family: "Instrument Serif", serif; font-size: 900px;
    color: rgba(162,126,59,0.08); pointer-events: none; user-select: none;
  }
  .row { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .vmark {
    width: 64px; height: 64px; border-radius: 50%;
    border: 2px solid rgba(162,126,59,0.5); background: rgba(162,126,59,0.1);
    display: flex; align-items: center; justify-content: center;
    font-family: "Instrument Serif", serif; font-size: 38px; color: #a27e3b;
  }
  .brandname { font-family: "Instrument Serif", serif; font-size: 40px; letter-spacing: -0.01em; }
  .brandname .dot { color: #a27e3b; }
  .tag { font-size: 16px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: #a27e3b; }
  .center { position: relative; z-index: 1; }
  h1 {
    font-family: "Instrument Serif", serif; font-weight: 400;
    font-size: 116px; line-height: 1.0; letter-spacing: -0.02em;
    color: #3a2e20; max-width: 900px;
  }
  .sub { margin-top: 28px; font-size: 26px; line-height: 1.4; font-weight: 500; color: #7a6650; max-width: 760px; }
  .contacts { position: relative; z-index: 1; font-size: 19px; color: #9a8870; display: flex; gap: 24px; align-items: center; }
  .contacts .sep { color: #a27e3b; opacity: 0.6; }
</style>
</head>
<body>
  <div class="ghost">V</div>
  <div class="row">
    <div class="brand">
      <div class="vmark">V</div>
      <div class="brandname">Vitaliy<span class="dot">.</span></div>
    </div>
    <div class="tag">Сайты · магазины · боты</div>
  </div>
  <div class="center">
    <h1>Сайты, которые приносят клиентов</h1>
    <div class="sub">Веду проект один — от идеи до поддержки. Пишете в Telegram — отвечает сам разработчик.</div>
  </div>
  <div class="contacts">
    <span>Telegram</span>
    <span class="sep">·</span>
    <span>WhatsApp</span>
    <span class="sep">·</span>
    <span>работаю по договору</span>
  </div>
</body>
</html>
