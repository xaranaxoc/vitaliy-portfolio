# Микросервис приёма заявок → Telegram.
# Запуск на VPS: docker compose up -d (из папки server/).
# Nginx проксирует /api/lead → 127.0.0.1:8001.
# Env берётся из .env рядом с docker-compose.yml.
services:
  lead:
    build: .
    container_name: vitaliy-lead
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - .env
